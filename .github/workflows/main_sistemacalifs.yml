name: Deploy HTML5 app to Azure Web App - SistemaCalifs

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_DC3DDAE325C24049B6B1E4C8AFC83B23 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_75D353DFF80E40A2944409977857BE26 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_8DEC6DC89EA249C19041424359D9B51B }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'SistemaCalifs'
          slot-name: 'Production'
          package: ./public_html
          
